        const lastGP = {

            podium: [
                { pos: 1, name: "Max Verstappen", team: "Red Bull Racing", time: "1:25:38.426" },
                { pos: 2, name: "Lando Norris", team: "McLaren", time: "+0.725s" },

            const [activeTab, setActiveTab] = useState('home');
            const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
            const [searchTerm, setSearchTerm] = useState('');
            const [statusFilter, setStatusFilter] = useState('all');
            const [selectedRace, setSelectedRace] = useState(null);

            // Countdown timer effect
            useEffect(() => {
                const targetDate = new Date(nextGP.date).getTime();
                const interval = setInterval(() => {
                    const now = new Date().getTime();
                    const difference = targetDate - now;

                    if (difference > 0) {
                        setTimeLeft({
                            days: Math.floor(difference / (1000 * 60 * 60 * 24)),
                            hours: Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                            minutes: Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60)),
                            seconds: Math.floor((difference % (1000 * 60)) / 1000)
                        });
                    }
                }, 1000);
                return () => clearInterval(interval);
            }, []);

            const filteredRaces = calendarRaces.filter(race => {
                const matchesSearch = race.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                  race.circuit.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesStatus = statusFilter === 'all' || race.status === statusFilter;
                return matchesSearch && matchesStatus;
            });

                                </div>

                                        <Timer className="w-4 h-4" />
                                        <span>Inicio</span>
                                    </button>
                                    <button 
                                        onClick={() => setActiveTab('standings')}
                                        className={`px-3 py-2 rounded-md text-sm font-semibold transition flex items-center space-x-1 ${activeTab === 'standings' ? 'bg-f1red text-white' : 'text-gray-300 hover:bg-gray-800'}`}
                                    >
                                        <Trophy className="w-4 h-4" />
                                        <span>Clasificación</span>
                                    </button>
                                    <button 
                                        onClick={() => setActiveTab('calendar')}
                                        className={`px-3 py-2 rounded-md text-sm font-semibold transition flex items-center space-x-1 ${activeTab === 'calendar' ? 'bg-f1red text-white' : 'text-gray-300 hover:bg-gray-800'}`}
                                    >
                                        <Calendar className="w-4 h-4" />
                                        <span>Calendario</span>
                                    </button>
                                </nav>
                            </div>
                        </div>

                                        <div className="space-y-4 text-center lg:text-left">
                                            <div className="inline-flex items-center space-x-2 bg-f1red/20 text-f1red px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide border border-f1red/30">
                                                <Flame className="w-3.5 h-3.5" />
                                                <span>Próxima Cita</span>
                                            </div>

                                                <span className="flex items-center gap-1"><MapPin className="w-4 h-4 text-f1red" /> {nextGP.circuit}</span>

                                            </div>

                                                <div className="text-[10px] sm:text-xs text-gray-400 uppercase font-semibold">Horas</div>
                                            </div>
                                            <div className="bg-f1dark/80 backdrop-blur border border-gray-700 p-3 sm:p-4 rounded-xl min-w-[70px] sm:min-w-[90px]">
                                                <div className="text-2xl sm:text-4xl font-black text-white">{timeLeft.minutes}</div>
                                                <div className="text-[10px] sm:text-xs text-gray-400 uppercase font-semibold">Min</div>
                                            </div>
                                            <div className="bg-f1dark/80 backdrop-blur border border-gray-700 p-3 sm:p-4 rounded-xl min-w-[70px] sm:min-w-[90px]">
                                                <div className="text-2xl sm:text-4xl font-black text-f1red animate-pulse">{timeLeft.seconds}</div>
                                                <div className="text-[10px] sm:text-xs text-gray-400 uppercase font-semibold">Seg</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                        <div>
                                            <div className="flex justify-between items-center mb-6">

                                                    <span className="text-xs font-semibold text-gray-400 flex items-center gap-1 group-hover:text-white">Leer artículo <ChevronRight className="w-3 h-3" /></span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'standings' && (
                            <div className="space-y-8">
                                <div className="border-b border-gray-800 pb-4">
                                    <h1 className="text-3xl font-black italic">Clasificación del Campeonato 2024</h1>
                                    <p className="text-sm text-gray-400">Puntuación oficial de pilotos y escuderías actualizada.</p>

                                        <h2 className="text-xl font-bold mb-6 flex items-center gap-2">
                                            <Users className="w-5 h-5 text-f1red" /> Mundial de Pilotos
                                        </h2>
                                        <div className="space-y-4">
                                            {driversStandings.map((driver) => (
                                                <div key={driver.pos} className="bg-f1dark p-4 rounded-lg border border-gray-800 space-y-2">
                                                    <div className="flex justify-between items-center">
                                                        <div className="flex items-center space-x-3">

                                                        <div className="flex items-center space-x-3">

                                                        <div className={`${team.color} h-full rounded-full`} style={{ width: `${(team.pts / 250) * 100}%` }}></div>

                                                </div>
                                            ))}

                                    </div>

                            <div className="space-y-8">

                                    </div>
                                    
                                    {/* Search & Filters */}
                                    <div className="flex flex-wrap items-center gap-3">
                                        <div className="relative">
                                            <Search className="w-4 h-4 text-gray-400 absolute left-3 top-3" />
                                            <input 
                                                type="text" 
                                                placeholder="Buscar circuito o GP..." 
                                                value={searchTerm}
                                                onChange={(e) => setSearchTerm(e.target.value)}
                                                className="bg-f1card border border-gray-700 rounded-lg pl-9 pr-4 py-2 text-sm text-white focus:outline-none focus:border-f1red"
                                            />
                                        </div>
                                        <div className="flex bg-f1card border border-gray-700 rounded-lg p-1">
                                            <button 
                                                onClick={() => setStatusFilter('all')}
                                                className={`px-3 py-1 rounded text-xs font-semibold ${statusFilter === 'all' ? 'bg-f1red text-white' : 'text-gray-400 hover:text-white'}`}
                                            >
                                                Todos
                                            </button>
                                            <button 
                                                onClick={() => setStatusFilter('completed')}
                                                className={`px-3 py-1 rounded text-xs font-semibold ${statusFilter === 'completed' ? 'bg-f1red text-white' : 'text-gray-400 hover:text-white'}`}
                                            >
                                                Disputados
                                            </button>
                                            <button 
                                                onClick={() => setStatusFilter('upcoming')}
                                                className={`px-3 py-1 rounded text-xs font-semibold ${statusFilter === 'upcoming' ? 'bg-f1red text-white' : 'text-gray-400 hover:text-white'}`}
                                            >
                                                Próximos
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {/* Calendar Grid */}
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {filteredRaces.map((race) => (
                                        <div key={race.round} className="bg-f1card rounded-xl border border-gray-800 p-5 flex flex-col justify-between hover:border-gray-700 transition">
                                            <div>
                                                <div className="flex justify-between items-center mb-3">
                                                    <span className="text-xs font-bold text-gray-400 uppercase">Ronda {race.round}</span>
                                                    <span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${race.status === 'completed' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-blue-500/20 text-blue-400 border border-blue-500/30'}`}>
                                                        {race.status === 'completed' ? 'Finalizado' : 'Próximamente'}
                                                    </span>
                                                </div>
                                                <h3 className="text-lg font-bold mb-1">{race.name}</h3>
                                                <p className="text-xs text-gray-400 flex items-center gap-1 mb-4">
                                                    <MapPin className="w-3.5 h-3.5 text-f1red" /> {race.circuit} ({race.date})
                                                </p>
                                            </div>
                                            <div className="pt-4 border-t border-gray-800 flex items-center justify-between text-xs">
                                                <span className="text-gray-400">Ganador / Pole:</span>
                                                <span className="font-bold text-white">{race.winner}</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-f1card border-t border-gray-800 py-6 mt-12">
                        <div className="max-w-7xl mx-auto px-4 text-center text-xs text-gray-500">
                            <p>© 2024 F1 Championship Hub. Datos simulados con fines demostrativos.</p>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
