                                                        </span>
                                                    </div>
                                                    <div className="p-6">
                                                        <span className="text-xs text-gray-400 font-semibold mb-2 block">{news.time}</span>
                                                        <h3 className="font-black text-lg leading-snug group-hover:text-f1red transition duration-200">{news.title}</h3>
                                                    </div>
                                                </div>
                                                <div className="px-6 pb-6 pt-0">
                                                    <span className="text-xs font-bold text-f1red flex items-center gap-1 group-hover:translate-x-1 transition duration-200 cursor-pointer">
                                                        Leer artículo completo <ArrowUpRight className="w-3.5 h-3.5" />
                                                    </span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'standings' && (
                            <div className="space-y-8 animate-fadeIn">
                                <div className="border-b border-f1border pb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                                    <div>
                                        <h1 className="text-3xl sm:text-4xl font-black italic uppercase">Clasificación del Campeonato 2024</h1>
                                        <p className="text-sm text-gray-400 mt-1">Puntuación oficial de pilotos y escuderías actualizada tras el último gran premio.</p>
                                    </div>
                                    <div className="bg-f1card px-4 py-2 rounded-xl border border-f1border flex items-center gap-2 text-xs text-gray-300">
                                        <Globe className="w-4 h-4 text-f1red" /> Temporada Oficial FIA 2024
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                    {/* Drivers Full Standings */}
                                    <div className="bg-f1card rounded-2xl border border-f1border p-6 shadow-2xl">
                                        <h2 className="text-xl font-black italic uppercase tracking-wider mb-6 flex items-center gap-2.5">
                                            <div className="p-2 bg-f1red/10 rounded-lg text-f1red border border-f1red/20">
                                                <Users className="w-5 h-5" />
                                            </div> 
                                            Mundial de Pilotos
                                        </h2>
                                        <div className="space-y-3">
                                            {driversStandings.map((driver) => (
                                                <div key={driver.pos} className="bg-f1dark/80 p-4 rounded-xl border border-f1border hover:border-gray-700 transition space-y-3">
                                                    <div className="flex justify-between items-center">
                                                        <div className="flex items-center space-x-3.5">
                                                            <span className={`font-black text-lg w-7 h-7 flex items-center justify-center rounded-lg ${driver.pos === 1 ? 'bg-f1red text-white' : 'bg-gray-800 text-gray-300'}`}>
                                                                {driver.pos}
                                                            </span>
                                                            <div>
                                                                <div className="font-black text-base">{driver.name}</div>
                                                                <div className="text-xs text-gray-400 font-semibold">{driver.team}</div>
                                                            </div>
                                                        </div>
                                                        <div className="text-2xl font-black text-f1red">{driver.pts} <span className="text-xs text-gray-400 font-bold">PTS</span></div>
                                                    </div>
                                                    <div className="w-full bg-gray-900 h-2 rounded-full overflow-hidden p-0.5 border border-f1border">
                                                        <div className={`${driver.color} h-full rounded-full transition-all duration-500`} style={{ width: `${(driver.pts / 150) * 100}%` }}></div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Constructors Full Standings */}
                                    <div className="bg-f1card rounded-2xl border border-f1border p-6 shadow-2xl">
                                        <h2 className="text-xl font-black italic uppercase tracking-wider mb-6 flex items-center gap-2.5">
                                            <div className="p-2 bg-f1red/10 rounded-lg text-f1red border border-f1red/20">
                                                <Shield className="w-5 h-5" />
                                            </div> 
                                            Mundial de Constructores
                                        </h2>
                                        <div className="space-y-3">
                                            {constructorsStandings.map((team) => (
                                                <div key={team.pos} className="bg-f1dark/80 p-4 rounded-xl border border-f1border hover:border-gray-700 transition space-y-3">
                                                    <div className="flex justify-between items-center">
                                                        <div className="flex items-center space-x-3.5">
                                                            <span className={`font-black text-lg w-7 h-7 flex items-center justify-center rounded-lg ${team.pos === 1 ? 'bg-f1red text-white' : 'bg-gray-800 text-gray-300'}`}>
                                                                {team.pos}
                                                            </span>
                                                            <div>
                                                                <div className="font-black text-base">{team.name}</div>
                                                                <div className="text-xs text-gray-400 font-semibold">Escudería oficial</div>
                                                            </div>
                                                        </div>
                                                        <div className="text-2xl font-black text-f1red">{team.pts} <span className="text-xs text-gray-400 font-bold">PTS</span></div>
                                                    </div>
                                                    <div className="w-full bg-gray-900 h-2 rounded-full overflow-hidden p-0.5 border border-f1border">
                                                        <div className={`${team.color} h-full rounded-full transition-all duration-500`} style={{ width: `${(team.pts / 250) * 100}%` }}></div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'calendar' && (
                            <div className="space-y-8 animate-fadeIn">
                                <div className="border-b border-f1border pb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                                    <div>
                                        <h1 className="text-3xl sm:text-4xl font-black italic uppercase">Calendario de Grandes Premios 2024</h1>
                                        <p className="text-sm text-gray-400 mt-1">Explora todas las citas del campeonato mundial de Fórmula 1.</p>
                                    </div>
                                    
                                    {/* Search & Filters */}
                                    <div className="flex flex-wrap items-center gap-3">
                                        <div className="relative">
                                            <Search className="w-4 h-4 text-gray-400 absolute left-3.5 top-3" />
                                            <input 
                                                type="text" 
                                                placeholder="Buscar circuito o GP..." 
                                                value={searchTerm}
                                                onChange={(e) => setSearchTerm(e.target.value)}
                                                className="bg-f1card border border-f1border rounded-xl pl-10 pr-4 py-2 text-sm text-white focus:outline-none focus:border-f1red transition shadow-inner"
                                            />
                                        </div>
                                        <div className="flex bg-f1card border border-f1border rounded-xl p-1 shadow-inner">
                                            <button 
                                                onClick={() => setStatusFilter('all')}
                                                className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${statusFilter === 'all' ? 'bg-f1red text-white shadow-md' : 'text-gray-400 hover:text-white'}`}
                                            >
                                                Todos
                                            </button>
                                            <button 
                                                onClick={() => setStatusFilter('completed')}
                                                className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${statusFilter === 'completed' ? 'bg-f1red text-white shadow-md' : 'text-gray-400 hover:text-white'}`}
                                            >
                                                Disputados
                                            </button>
                                            <button 
                                                onClick={() => setStatusFilter('upcoming')}
                                                className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${statusFilter === 'upcoming' ? 'bg-f1red text-white shadow-md' : 'text-gray-400 hover:text-white'}`}
                                            >
                                                Próximos
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {/* Calendar Grid */}
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {filteredRaces.map((race) => (
                                        <div key={race.round} className="bg-f1card rounded-2xl border border-f1border p-6 flex flex-col justify-between hover:border-f1red/50 transition duration-300 shadow-xl group">
                                            <div>
                                                <div className="flex justify-between items-center mb-3">
                                                    <span className="text-xs font-black text-gray-400 uppercase tracking-wider">Ronda {race.round}</span>
                                                    <span className={`text-xs px-2.5 py-1 rounded-full font-bold uppercase tracking-wider ${race.status === 'completed' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-blue-500/10 text-blue-400 border border-blue-500/20'}`}>
                                                        {race.status === 'completed' ? 'Finalizado' : 'Próximamente'}
                                                    </span>
                                                </div>
                                                <h3 className="text-xl font-black italic mb-2 group-hover:text-f1red transition duration-200">{race.name}</h3>
                                                <p className="text-xs text-gray-400 flex items-center gap-1.5 mb-6 font-semibold bg-f1dark/50 p-2.5 rounded-xl border border-f1border/40">
                                                    <MapPin className="w-4 h-4 text-f1red flex-shrink-0" /> <span>{race.circuit} <strong className="text-gray-200 font-bold">({race.date})</strong></span>
                                                </p>
                                            </div>
                                            <div className="pt-4 border-t border-f1border flex items-center justify-between text-xs">
                                                <span className="text-gray-400 font-semibold">Ganador / Pole:</span>
                                                <span className="font-black text-white bg-f1dark px-3 py-1 rounded-lg border border-f1border">{race.winner}</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-f1card border-t border-f1border py-8 mt-16">
                        <div className="max-w-7xl mx-auto px-4 text-center text-xs text-gray-500 flex flex-col sm:flex-row items-center justify-between gap-4">
                            <div className="flex items-center space-x-2">
                                <div className="bg-f1red px-2 py-0.5 text-xs font-black italic text-white rounded">F1</div>
                                <span className="font-bold text-gray-400">Championship Hub 2024</span>
                            </div>
                            <p>© 2024 F1 Championship Hub. Datos simulados con fines demostrativos y estéticos.</p>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
