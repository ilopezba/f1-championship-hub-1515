<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigo Invisible Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        f1red: '#e10600',
                        f1dark: '#0f0f13',
                        f1card: '#16161f',
                        f1gray: '#252533',
                        f1border: '#2a2a3c'
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 3s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-5px)' },
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;0,900;1,400;1,700&display=swap');
        body { font-family: 'Titillium Web', sans-serif; }
        .glass-effect {
            background: rgba(22, 22, 31, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-f1dark text-gray-100 min-h-screen antialiased selection:bg-f1red selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { 
            Gift, Users, Sparkles, Plus, Trash2, Eye, EyeOff, RotateCcw, CheckCircle, AlertCircle, Heart, DollarSign
        } = lucide;

        function App() {
            const [participants, setParticipants] = useState([
                { id: 1, name: "Ana", email: "ana@example.com", wishlist: "Libros de misterio, taza bonita" },
                { id: 2, name: "Carlos", email: "carlos@example.com", wishlist: "Café de especialidad, calcetines divertidos" },
                { id: 3, name: "Elena", email: "elena@example.com", wishlist: "Velas aromáticas, chocolatinas" },
                { id: 4, name: "David", email: "david@example.com", wishlist: "Camiseta de grupos de rock, vinilos" }
            ]);

            const [newName, setNewName] = useState('');
            const [newEmail, setNewEmail] = useState('');
            const [newWishlist, setNewWishlist] = useState('');
            const [budget, setBudget] = useState('20€');
            const [exclusions, setExclusions] = useState([]); // [{from: id, to: id}]
            const [newExFrom, setNewExFrom] = useState('');
            const [newExTo, setNewExTo] = useState('');
            
            const [results, setResults] = useState([]); // [{giverId, receiverId, revealed}]
            const [selectedGiverId, setSelectedGiverId] = useState('');
            const [myAssignment, setMyAssignment] = useState(null);
            const [errorMsg, setErrorMsg] = useState('');
            const [successMsg, setSuccessMsg] = useState('');
            const [isAnimating, setIsAnimating] = useState(false);

            // Agregar participante
            const handleAddParticipant = (e) => {
                e.preventDefault();
                if (!newName.trim()) return;
                const newParticipant = {
                    id: Date.now(),
                    name: newName.trim(),
                    email: newEmail.trim() || `${newName.toLowerCase().replace(/\s+/g, '')}@example.com`,
                    wishlist: newWishlist.trim() || 'Cualquier detalle es bienvenido'
                };
                setParticipants([...participants, newParticipant]);
                setNewName('');
                setNewEmail('');
                setNewWishlist('');
                setSuccessMsg('');
            };

            // Eliminar participante
            const handleRemoveParticipant = (id) => {
                setParticipants(participants.filter(p => p.id !== id));
                setResults([]);
                setSuccessMsg('');
            };

            // Agregar exclusión
            const handleAddExclusion = (e) => {
                e.preventDefault();
                if (!newExFrom || !newExTo || newExFrom === newExTo) return;
                // Evitar duplicados
                const exists = exclusions.some(ex => (ex.from === Number(newExFrom) && ex.to === Number(newExTo)));
                if (!exists) {
                    setExclusions([...exclusions, { from: Number(newExFrom), to: Number(newExTo) }]);
                }
                setNewExFrom('');
                setNewExTo('');
            };

            // Eliminar exclusión
            const handleRemoveExclusion = (index) => {
                setExclusions(exclusions.filter((_, i) => i !== index));
            };

            // Algoritmo de emparejamiento (Backtracking / Barajado)
            const generateDraw = () => {
                setErrorMsg('');
                setSuccessMsg('');
                if (participants.length < 3) {
                    setErrorMsg('Necesitas al menos 3 participantes para hacer el amigo invisible.');
                    return;
                }

                setIsAnimating(true);
                setTimeout(() => {
                    let attempts = 0;
                    let success = false;
                    let receivers = [];

                    while (attempts < 1000 && !success) {
                        attempts++;
                        receivers = [...participants].sort(() => Math.random() - 0.5);
                        
                        let valid = true;
                        for (let i = 0; i < participants.length; i++) {
                            const giver = participants[i];
                            const receiver = receivers[i];

                            // No se puede regalar a uno mismo
                            if (giver.id === receiver.id) {
                                valid = false;
                                break;
                            }

                            // Comprobar exclusiones
                            const isExcluded = exclusions.some(ex => ex.from === giver.id && ex.to === receiver.id);
                            if (isExcluded) {
                                valid = false;
                                break;
                            }
                        }

                        if (valid) {
                            success = true;
                        }
                    }

                    if (success) {
                        const newRes = participants.map((giver, idx) => ({
                            giverId: giver.id,
                            receiverId: receivers[idx].id,
                            revealed: false
                        }));
                        setResults(newRes);
                        setSuccessMsg('¡Sorteo realizado con éxito! Cada participante ya puede consultar a quién le regala.');
                    } else {
                        setErrorMsg('No se ha podido encontrar una combinación válida con estas exclusiones. Prueba a eliminar alguna restricción.');
                    }
                    setIsAnimating(false);
                }, 800);
            };

            // Consultar asignación individual
            const handleCheckAssignment = () => {
                if (!selectedGiverId) return;
                const assignment = results.find(r => r.giverId === Number(selectedGiverId));
                if (assignment) {
                    const receiver = participants.find(p => p.id === assignment.receiverId);
                    setMyAssignment(receiver);
                }
            };

            return (
                <div className="min-h-screen flex flex-col bg-f1dark text-white relative">
                    {/* Background Glows */}
                    <div className="absolute top-0 left-1/4 w-96 h-96 bg-f1red/10 rounded-full blur-3xl pointer-events-none"></div>
                    <div className="absolute top-1/3 right-10 w-80 h-80 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>

                    {/* Header */}
                    <header className="glass-effect border-b border-f1border sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-20">
                                <div className="flex items-center space-x-3 cursor-pointer">
                                    <div className="bg-gradient-to-br from-f1red to-pink-600 p-2.5 rounded-xl shadow-lg shadow-f1red/30 text-white">
                                        <Gift className="w-6 h-6" />
                                    </div>
                                    <div>
                                        <span className="font-black tracking-wider uppercase text-lg bg-gradient-to-r from-white to-gray-400 bg-clip-text text-transparent">Amigo Invisible</span>
                                        <span className="text-f1red font-black tracking-widest text-lg block -mt-1">HUB</span>
                                    </div>
                                </div>
                                <div className="text-xs sm:text-sm font-bold text-gray-300 bg-f1card px-4 py-2 rounded-xl border border-f1border flex items-center gap-2">
                                    <DollarSign className="w-4 h-4 text-f1red" /> Presupuesto: <span className="text-white font-black">{budget}</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-10 relative z-10">
                        {/* Hero Section */}
                        <div className="relative rounded-3xl overflow-hidden bg-gradient-to-br from-f1card to-f1dark border border-f1border p-8 sm:p-12 shadow-2xl flex flex-col items-center text-center">
                            <div className="inline-flex items-center space-x-2 bg-f1red/20 text-f1red px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-widest border border-f1red/30 mb-4 animate-pulse-slow">
                                <Sparkles className="w-4 h-4" />
                                <span>Sorteos Fáciles y Secretos</span>
                            </div>
                            <h1 className="text-4xl sm:text-6xl font-black italic tracking-tight mb-4">Organiza tu Amigo Invisible</h1>
                            <p className="text-gray-400 max-w-2xl text-sm sm:text-base font-medium mb-8">
                                Añade a los participantes, define exclusiones si es necesario (ej: parejas que no se deben regalar) ¡y genera los emparejamientos de forma totalmente aleatoria y sin spoilers!
                            </p>

                            {/* Botón principal de sorteo */}
                            <button 
                                onClick={generateDraw}
                                disabled={isAnimating}
                                className="bg-gradient-to-r from-f1red to-red-700 hover:from-red-600 hover:to-red-800 text-white font-black italic uppercase tracking-wider px-8 py-4 rounded-2xl shadow-xl shadow-f1red/40 transform hover:scale-105 transition duration-200 flex items-center gap-3 text-lg"
                            >
                                <Gift className={`w-6 h-6 ${isAnimating ? 'animate-spin' : ''}`} />
                                {isAnimating ? 'Barajando nombres...' : '¡Realizar Sorteo Mágico!'}
                            </button>

                            {errorMsg && (
                                <div className="mt-4 p-3 bg-red-500/20 border border-red-500/40 rounded-xl text-red-300 text-xs sm:text-sm flex items-center gap-2">
                                    <AlertCircle className="w-4 h-4 flex-shrink-0" /> {errorMsg}
                                </div>
                            </li>
                            {successMsg && (
                                <div className="mt-4 p-3 bg-emerald-500/20 border border-emerald-500/40 rounded-xl text-emerald-300 text-xs sm:text-sm flex items-center gap-2">
                                    <CheckCircle className="w-4 h-4 flex-shrink-0" /> {successMsg}
                                </div>
                            )}
                        </div>

                        {/* Grid: Participantes & Exclusiones */}
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            {/* Sección Participantes */}
                            <div className="bg-f1card rounded-2xl border border-f1border p-6 shadow-xl flex flex-col justify-between">
                                <div>
                                    <div className="flex justify-between items-center mb-6 pb-3 border-b border-f1border">
                                        <h2 className="text-lg font-black uppercase italic tracking-wider flex items-center gap-2.5">
                                            <div className="p-2 bg-f1red/10 rounded-lg text-f1red border border-f1red/20">
                                                <Users className="w-4 h-4" />
                                            </div> 
                                            Participantes ({participants.length})
                                        </h2>
                                    </div>

                                    {/* Formulario nuevo participante */}
                                    <form onSubmit={handleAddParticipant} className="space-y-3 mb-6 bg-f1dark/60 p-4 rounded-xl border border-f1border">
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <input 
                                                type="text" 
                                                placeholder="Nombre del participante" 
                                                value={newName}
                                                onChange={(e) => setNewName(e.target.value)}
                                                className="bg-f1card border border-f1border rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-f1red"
                                            />
                                            <input 
                                                type="text" 
                                                placeholder="Ideas de regalo (Opcional)" 
                                                value={newWishlist}
                                                onChange={(e) => setNewWishlist(e.target.value)}
                                                className="bg-f1card border border-f1border rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-f1red"
                                            />
                                        </div>
                                        <button type="submit" className="w-full bg-f1red hover:bg-red-700 text-white font-bold py-2 rounded-xl text-xs uppercase tracking-wider transition flex items-center justify-center gap-2">
                                            <Plus className="w-4 h-4" /> Añadir Participante
                                        </button>
                                    </form>

                                    {/* Lista */}
                                    <div className="space-y-2.5 max-h-72 overflow-y-auto pr-1">
                                        {participants.map((p) => (
                                            <div key={p.id} className="flex items-center justify-between bg-f1dark/80 p-3 rounded-xl border border-f1border/60">
                                                <div>
                                                    <div className="font-bold text-sm text-white">{p.name}</div>
                                                    <div className="text-xs text-gray-400 italic">💡 Desea: {p.wishlist}</div>
                                                </div>
                                                <button onClick={() => handleRemoveParticipant(p.id)} className="text-gray-500 hover:text-red-400 p-1.5 transition">
                                                    <Trash2 className="w-4 h-4" />
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* Sección Exclusiones y Presupuesto */}
                            <div className="space-y-8">
                                <div className="bg-f1card rounded-2xl border border-f1border p-6 shadow-xl">
                                    <h2 className="text-lg font-black uppercase italic tracking-wider mb-4 pb-3 border-b border-f1border flex items-center gap-2.5">
                                        <div className="p-2 bg-f1red/10 rounded-lg text-f1red border border-f1red/20">
                                            <AlertCircle className="w-4 h-4" />
                                        </div> 
                                        Restricciones / Exclusiones
                                    </h2>
                                    <p className="text-xs text-gray-400 mb-4">Evita que ciertas personas se regalen entre sí (por ejemplo, parejas).</p>
                                    
                                    <form onSubmit={handleAddExclusion} className="flex flex-col sm:flex-row gap-2 mb-4">
                                        <select 
                                            value={newExFrom} 
                                            onChange={(e) => setNewExFrom(e.target.value)}
                                            className="bg-f1dark border border-f1border rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-f1red flex-1"
                                        >
                                            <option value="">¿Quién NO regala a...</option>
                                            {participants.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                        </select>
                                        <select 
                                            value={newExTo} 
                                            onChange={(e) => setNewExTo(e.target.value)}
                                            className="bg-f1dark border border-f1border rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-f1red flex-1"
                                        >
                                            <option value="">...a esta persona?</option>
                                            {participants.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                        </select>
                                        <button type="submit" className="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition">
                                            Añadir
                                        </button>
                                    </form>

                                    <div className="space-y-2 max-h-40 overflow-y-auto">
                                        {exclusions.length === 0 ? (
                                            <p className="text-xs text-gray-500 italic">No hay restricciones añadidas.</p>
                                        ) : (
                                            exclusions.map((ex, idx) => {
                                                const fromName = participants.find(p => p.id === ex.from)?.name;
                                                const toName = participants.find(p => p.id === ex.to)?.name;
                                                return (
                                                    <div key={idx} className="flex items-center justify-between bg-f1dark/60 px-3 py-2 rounded-xl text-xs border border-f1border">
                                                        <span><strong className="text-f1red">{fromName}</strong> no puede regalar a <strong className="text-f1red">{toName}</strong></span>
                                                        <button onClick={() => handleRemoveExclusion(idx)} className="text-gray-500 hover:text-red-400"><Trash2 className="w-3.5 h-3.5"/></button>
                                                    </div>
                                                );
                                            })
                                        )}
                                    </div>
                                </div>

                                {/* Configurar Presupuesto */}
                                <div className="bg-f1card rounded-2xl border border-f1border p-6 shadow-xl">
                                    <h2 className="text-lg font-black uppercase italic tracking-wider mb-4 pb-3 border-b border-f1border flex items-center gap-2.5">
                                        <div className="p-2 bg-f1red/10 rounded-lg text-f1red border border-f1red/20">
                                            <DollarSign className="w-4 h-4" />
                                        </div> 
                                        Presupuesto del Regalo
                                    </h2>
                                    <div className="flex gap-2">
                                        {['10€', '15€', '20€', '30€', '50€'].map((b) => (
                                            <button 
                                                key={b}
                                                onClick={() => setBudget(b)}
                                                className={`flex-1 py-2 rounded-xl text-xs font-bold border transition ${budget === b ? 'bg-f1red border-f1red text-white shadow-md' : 'bg-f1dark border-f1border text-gray-400 hover:text-white'}`}
                                            >
                                                {b}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Sección de Revelación de Resultados */}
                        {results.length > 0 && (
                            <div className="bg-f1card rounded-3xl border border-f1border p-8 shadow-2xl space-y-6">
                                <div className="text-center max-w-xl mx-auto">
                                    <h2 className="text-2xl font-black italic uppercase tracking-wider mb-2">Consulta tu Amigo Invisible</h2>
                                    <p className="text-xs text-gray-400">Selecciona tu nombre en el desplegable para descubrir a quién te ha tocado regalarle en secreto.</p>
                                </div>

                                <div className="max-w-md mx-auto space-y-4">
                                    <select 
                                        value={selectedGiverId}
                                        onChange={(e) => {
                                            setSelectedGiverId(e.target.value);
                                            setMyAssignment(null);
                                        }}
                                        className="w-full bg-f1dark border border-f1border rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-f1red font-bold"
                                    >
                                        <option value="">Selecciona tu nombre...</option>
                                        {participants.map(p => (
                                            <option key={p.id} value={p.id}>{p.name}</option>
                                        ))}
                                    </select>

                                    <button 
                                        onClick={handleCheckAssignment}
                                        disabled={!selectedGiverId}
                                        className="w-full bg-gradient-to-r from-red-600 to-f1red hover:from-red-500 hover:to-red-600 text-white font-bold py-3 rounded-2xl text-sm uppercase tracking-wider transition shadow-lg disabled:opacity-50"
                                    >
                                        Revelar mi Amigo Invisible 🤫
                                    </button>

                                    {myAssignment && (
                                        <div className="bg-f1dark/90 border border-f1red/50 rounded-2xl p-6 text-center space-y-3 animate-fadeIn shadow-2xl">
                                            <div className="text-xs text-f1red font-bold uppercase tracking-widest">Te ha tocado regalar a:</div>
                                            <div className="text-3xl font-black italic text-white">🎁 {myAssignment.name}</div>
                                            <div className="bg-f1card p-3 rounded-xl border border-f1border text-xs text-gray-300">
                                                <strong className="text-f1red">💡 Lista de deseos:</strong> {myAssignment.wishlist}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-f1card border-t border-f1border py-8 mt-16">
                        <div className="max-w-7xl mx-auto px-4 text-center text-xs text-gray-500 flex flex-col sm:flex-row items-center justify-between gap-4">
                            <div className="flex items-center space-x-2">
                                <div className="bg-f1red px-2 py-0.5 text-xs font-black italic text-white rounded">XMAS</div>
                                <span className="font-bold text-gray-400">Amigo Invisible Hub</span>
                            </div>
                            <p>© 2024 Amigo Invisible Hub. ¡Disfruta de tus regalos!</p>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
